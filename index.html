<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Maatopolis</title>
    <meta name="description" content="Maatopolis: Restoring balance to mainstream media. Join us as we elevate sidelined narratives and unite the world through essential, powerful storytelling.">
    
    <!-- Open Graph Tags for iMessage, Twitter, and Facebook Previews -->
    <meta property="og:title" content="Maatopolis">
    <meta property="og:description" content="Maatopolis: Restoring balance to mainstream media. Join us as we elevate sidelined narratives and unite the world through essential, powerful storytelling.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://maatopolis.com/">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top; 
        }

        /* Portrait Mobile (Letterboxed - black bars top and bottom) */
        @media (orientation: portrait) {
            .video-container video {
                object-fit: contain !important; 
                object-position: center center !important;
            }
        }

        /* Landscape Mobile (Pillarboxed - black bars left and right to prevent cropping) */
        @media (orientation: landscape) and (max-height: 600px) {
            .video-container video {
                object-fit: contain !important;
                object-position: center center !important;
            }
        }

        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            z-index: 2; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease; 
        }

        .button-group {
            display: flex;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .button-group {
                flex-direction: column;
                gap: 15px;
            }
        }

        .enter-button {
            padding: 15px 40px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .enter-button:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .social-links {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 30px;
        }

        .social-links a {
            color: #fff;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.5;
            transition: opacity 0.3s ease, color 0.3s ease;
        }

        .social-links a:hover {
            opacity: 1;
            color: #ffd700;
        }

        .floating-menu-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.8s ease;
            cursor: pointer;
            z-index: 3;
            opacity: 0;
            pointer-events: none; 
        }

        .floating-menu-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .floating-menu-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bg-video" loop playsinline>
            <source src="maatopolis-bg.mp4" type="video/mp4">
        </video>
    </div>

    <a href="#" id="menu-btn" class="floating-menu-btn">Menu</a>

    <div id="splash-screen">
        <div class="button-group">
            <a href="#" id="enter-btn" class="enter-button">Enter Maatopolis</a>
            <a href="about.html" class="enter-button">About</a>
        </div>
        
        <div class="social-links">
            <a href="https://www.instagram.com/maatopolis" target="_blank">Instagram</a>
            <a href="https://www.linkedin.com/company/maatopolis/about/?viewAsMember=true" target="_blank">LinkedIn</a>
        </div>
    </div>

    <script>
        var video = document.getElementById('bg-video');
        var splash = document.getElementById('splash-screen');
        var menuBtn = document.getElementById('menu-btn');

        document.getElementById('enter-btn').addEventListener('click', function(e) {
            e.preventDefault(); 
            
            video.volume = 1.0; 
            video.play();
            
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            
            menuBtn.classList.add('visible');
        });

        menuBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            video.pause();
            video.currentTime = 0;
            
            menuBtn.classList.remove('visible');

            splash.style.opacity = '1';
            splash.style.pointerEvents = 'auto';
        });
    </script>

</body>
</html>

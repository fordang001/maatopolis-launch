<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Maatopolis</title>
    <meta name="description" content="Maatopolis: Restoring balance to mainstream media. Join us as we elevate sidelined narratives and unite the world through essential, powerful storytelling.">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Anchors the video to the top for desktop */
            object-position: center top; 
        }

        /* Portrait Mobile (Letterboxed like the guy in the hat) */
        @media (orientation: portrait) {
            .video-container video {
                object-fit: contain !important; 
                object-position: center center !important;
            }
        }

        /* Landscape Mobile (Full screen when rotated sideways) */
        @media (orientation: landscape) and (max-height: 600px) {
            .video-container video {
                object-fit: cover !important;
                object-position: center top !important;
            }
        }

        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000; 
            z-index: 2; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease; 
        }

        .enter-button {
            padding: 15px 40px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .enter-button:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="bg-video" loop playsinline>
            <source src="maatopolis-bg.mp4" type="video/mp4">
        </video>
    </div>

    <div id="splash-screen">
        <a href="#" id="enter-btn" class="enter-button">Enter Maatopolis</a>
    </div>

    <script>
        document.getElementById('enter-btn').addEventListener('click', function(e) {
            e.preventDefault(); 
            
            var video = document.getElementById('bg-video');
            var splash = document.getElementById('splash-screen');
            
            video.volume = 1.0; 
            video.play();
            
            splash.style.opacity = '0';
            
            setTimeout(function() {
                splash.style.display = 'none';
            }, 1500); 
        });
    </script>

</body>
</html>
